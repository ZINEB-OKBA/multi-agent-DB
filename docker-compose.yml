version: '3.9'

services:

  # ─────────────────────────────────────────────────────────────
  # 🗄️  PostgreSQL — données persistées via volume nommé
  # ─────────────────────────────────────────────────────────────
  staffing_db:
    image: postgres:15
    container_name: staffing_db
    restart: unless-stopped # ← redémarre automatiquement
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: staffdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data # ← tes données survivent ici
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d staffdb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # 🛠️  pgAdmin — configuration persistée + serveur pré-enregistré
  # ─────────────────────────────────────────────────────────────
  agentic_pgadmin:
    image: dpage/pgadmin4
    container_name: agentic_pgadmin
    restart: unless-stopped
    ports:
      - "5055:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # ↓ Dit à pgAdmin de charger servers.json au 1er démarrage
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      # ① Persistance de toute la config pgAdmin (connexions, préférences, historique)
      - pgadmin_data:/var/lib/pgadmin
      # ② Fichier qui pré-enregistre le serveur PostgreSQL automatiquement
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      # ③ Fichier de mot de passe pour la connexion automatique (pas de popup)
      - ./pgadmin/pgpass:/pgpass:ro
    depends_on:
      staffing_db:
        condition: service_healthy
    networks:
      - app_network

  # ─────────────────────────────────────────────────────────────
  # 🤖  FastAPI
  # ─────────────────────────────────────────────────────────────
  agentic_analytics_api:
    build:
      context: ./documenting-agent
      dockerfile: Dockerfile
    container_name: agentic_analytics_api
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:4201,http://localhost:8080,http://localhost:8081}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATA_DIR=${DATA_DIR:-data}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
      - DB_HOST=staffing_db
      - DB_NAME=staffdb
      - DB_USER=postgres
      - DB_PASSWORD=Admin123
      - SPRING_BOOT_CALLBACK_URL=http://backend-web:8080/api/internal/documents/callback
    depends_on:
      staffing_db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./fastembed_cache:/tmp/fastembed_cache
    networks:
      - app_network

  # ─────────────────────────────────────────────────────────────
  # ☕  Spring Boot
  # ─────────────────────────────────────────────────────────────
  backend-web:
    build:
      context: ./dev/backend/Backend-Motul
      dockerfile: Dockerfile
    container_name: backend-web
    restart: unless-stopped
    ports:
      - "8084:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://staffing_db:5432/staffdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=Admin123
      - EXTERNAL_AI_URL=http://agentic_analytics_api:8000/api/chat/message
      - EXTERNAL_AI_PROJECTS=http://agentic_analytics_api:8000/api/projects
      - EXTERNAL_AI_DOCUMENTS=http://agentic_analytics_api:8000/api/documents/backoffice/receive-and-index
      - EXTERNAL_AI_DEX=http://agentic_analytics_api:8000/api/ai
    depends_on:
      staffing_db:
        condition: service_healthy
      agentic_analytics_api:
        condition: service_started
    networks:
      - app_network

  # ─────────────────────────────────────────────────────────────
  # 🎨  Angular
  # ─────────────────────────────────────────────────────────────
  motul-frontend:
    build:
      context: ./dev/Front-Motul/Front-Motul
      dockerfile: Dockerfile
    container_name: motul-frontend
    restart: unless-stopped
    ports:
      - "4201:80"
    depends_on:
      - backend-web
    networks:
      - app_network

# ─────────────────────────────────────────────────────────────
# Volumes — DEUX volumes nommés maintenant
# ─────────────────────────────────────────────────────────────
volumes:
  postgres_data: # ← données PostgreSQL (existait déjà)
  pgadmin_data:
    # ← config pgAdmin (NOUVEAU — résout ton problème)

networks:
  app_network:
    driver: bridge
